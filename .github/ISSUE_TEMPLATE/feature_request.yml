name: Feature request
description: Suggest a new feature or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        SnipDock has a narrow scope (status-bar snippet management). Ideas that fit the scope are very welcome. Ideas that expand into broader theme or CSS tooling are likely to be declined, but a good description is the best way to find out.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow pain point or missing capability. Stories beat lists.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like SnipDock to behave? A rough description is fine, no need to design the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other plugins, manual workarounds, or different approaches you thought about.

  - type: textarea
    id: mockup
    attributes:
      label: Mockups or screenshots
      description: Optional. Sketches or annotated screenshots of similar tools are very helpful.
