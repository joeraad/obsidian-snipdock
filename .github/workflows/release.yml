name: Release

# Fires when you click "Publish release" in the GitHub UI.
# Build the plugin, sign artifact attestations, and attach
# main.js, manifest.json, and styles.css to the release.
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write       # needed for sigstore OIDC token (attestations)
  attestations: write   # needed to upload the attestation bundle

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Attach build artefacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            main.js manifest.json styles.css --clobber
